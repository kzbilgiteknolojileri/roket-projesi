<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roket Animasyonu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="rocket-page">
    <canvas id="rocket-canvas"></canvas>

    <div id="atmosphere"></div>

    <div id="countdown-overlay">
        <div id="countdown-number">3</div>
    </div>

    <div id="success-overlay">
        <div class="success-icon">🚀</div>
        <div class="success-text" id="success-title">KALKIŞ BAŞARILI</div>
        <div class="success-subtext" id="success-sub">Yörüngeye ulaşıldı!</div>
    </div>

    <div id="stats-panel" style="display:none;">
        <div class="stats-title" id="stats-title">GÖREV İSTATİSTİKLERİ</div>
        <div class="stats-grid">
            <div class="stat-item">
                <span class="stat-label" id="stat-lbl-time">UÇUŞ SÜRESİ</span>
                <span class="stat-value" id="stat-val-time">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label" id="stat-lbl-fuel">YAKIT TÜKETİMİ</span>
                <span class="stat-value" id="stat-val-fuel">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label" id="stat-lbl-speed">MAKS HIZ</span>
                <span class="stat-value" id="stat-val-speed">-</span>
            </div>
            <div class="stat-item">
                <span class="stat-label" id="stat-lbl-alt">MAKS YÜKSEKLİK</span>
                <span class="stat-value" id="stat-val-alt">-</span>
            </div>
        </div>

        <div class="comparison-block" id="comparison-block" style="display:none;">
            <div class="comparison-title" id="comparison-title">🏆 GÖREV KARŞILAŞTIRMASI</div>
            <div class="comparison-list" id="comparison-list"></div>
        </div>
    </div>

    <div class="rocket-lang-switch">
        <button id="r-lang-tr" class="r-lang-btn active">TR</button>
        <button id="r-lang-en" class="r-lang-btn">EN</button>
    </div>

    <div id="info-panel">
        <div class="info-header" id="rocket-name">SATURN V</div>
        <div class="info-item">
            <span class="info-label" id="lbl-speed">HIZ</span>
            <span class="info-value" id="info-speed">0 m/s</span>
        </div>
        <div class="info-item">
            <span class="info-label" id="lbl-accel">İVME</span>
            <span class="info-value" id="info-accel">0 m/s²</span>
        </div>
        <div class="info-item">
            <span class="info-label" id="lbl-fuel">YAKIT</span>
            <span class="info-value" id="info-fuel">100%</span>
        </div>
        <div class="info-item">
            <span class="info-label" id="lbl-mass">KÜTLE</span>
            <span class="info-value" id="info-mass">2.970 t</span>
        </div>
        <div class="info-item">
            <span class="info-label" id="lbl-alt">YÜKSEKLİK</span>
            <span class="info-value" id="info-altitude">0 m</span>
        </div>
        <div class="info-item">
            <span class="info-label" id="lbl-time">SÜRE</span>
            <span class="info-value" id="info-time">0.0 s</span>
        </div>
    </div>

    <div id="chart-panel">
        <div class="chart-title" id="chart-title">TELEMETRİ</div>
        <canvas id="chart-canvas" width="260" height="110"></canvas>
        <div class="chart-legend">
            <span><span class="legend-dot speed"></span><span id="legend-speed">Hız</span></span>
            <span><span class="legend-dot alt"></span><span id="legend-alt">Yükseklik</span></span>
        </div>
    </div>

    <div id="local-controls">
        <button id="voice-btn" class="local-btn voice">🎤 SESLİ DENETİM</button>
        <button id="launch-btn" class="local-btn launch">🚀 ATEŞLE</button>
        <button id="reset-btn" class="local-btn reset">🔄 SIFIRLA</button>
    </div>

    <div id="status-message">Bekleniyor...</div>

    <div class="voice-toast" id="voice-toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="rocket.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roket Kontrol Merkezi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="control-page">
    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <div class="login-icon">🔐</div>
            <h1 id="login-title">Kontrol Merkezi</h1>
            <p id="login-sub">Yetkili giriş gereklidir</p>
            <input type="password" id="password-input" placeholder="Şifre" autocomplete="off">
            <button id="login-btn">GİRİŞ YAP</button>
            <div id="login-error" class="login-error"></div>
        </div>
    </div>

    <div id="control-panel" style="display: none;">
        <div class="panel-header">
            <div class="live-badge">
                <span class="live-dot"></span><span id="live-text">CANLI YAYIN</span>
            </div>
            <h1 id="header-title">🚀 ROKET KONTROL MERKEZİ</h1>
            <div class="header-right">
                
                <div class="lang-switch">
                    <button class="lang-btn active" data-lang="tr" id="lang-tr">TR</button>
                    <button class="lang-btn" data-lang="en" id="lang-en">EN</button>
                </div>
                <div class="header-time" id="header-time">--:--</div>
            </div>
        </div>

        <div class="master-buttons">
            <button id="launch-all" class="master-btn launch-all">🔥 TÜMÜNÜ ATEŞLE</button>
            <button id="stop-all" class="master-btn stop-all">⏹ TÜMÜNÜ DURDUR</button>
            <button id="reset-all" class="master-btn reset-all">🔄 TÜMÜNÜ SIFIRLA</button>
        </div>

        <div id="rocket-controls"></div>
    </div>

    <div class="voice-toast" id="voice-toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="control.js"></script>
</body>
</html>
